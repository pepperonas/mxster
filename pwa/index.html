  <!-- Initial Loading Screen - Shown immediately while React loads -->
  <style>
    /* Colors are hex literals mirrored from src/styles/design-tokens.css
       (loader paints before any bundled CSS loads): surface neutral-6/98,
       primary cyan p80/p40, primary-container p30/p90. */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #12131a 0%, #1e1f27 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    :root[data-theme="light"] #initial-loader {
      background: linear-gradient(135deg, #fbf8ff 0%, #eeedf8 100%);
    }
    #initial-loader.loaded {
      opacity: 0;
      pointer-events: none;
    }
    /* Mini M3 contained loading indicator: tonal container with morphing
       corners + rotating arc */
    .loader-spinner {
      width: 56px;
      height: 56px;
      background: #004d64;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: loader-morph 2.4s cubic-bezier(0.38, 1.21, 0.22, 1) infinite;
    }
    .loader-spinner::after {
      content: '';
      width: 28px;
      height: 28px;
      border: 3.5px solid transparent;
      border-top-color: #bde9ff;
      border-right-color: #bde9ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    :root[data-theme="light"] .loader-spinner { background: #bde9ff; }
    :root[data-theme="light"] .loader-spinner::after {
      border-top-color: #004d64;
      border-right-color: #004d64;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes loader-morph {
      0%, 100% { border-radius: 28px; }
      50% { border-radius: 12px; }
    }
    .loader-text {
      margin-top: 20px;
      color: #68d3ff;
      font-size: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: pulse 1.5s ease-in-out infinite;
    }
    :root[data-theme="light"] .loader-text { color: #006684; }
    @media (prefers-reduced-motion: reduce) {
      .loader-spinner { animation: none; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>

<body>
  <!-- Initial Loading Screen -->
  <div id="initial-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">mxster lädt...</div>
  </div>

  <!-- React App Root -->
  <div id="app"></div>

  <!-- Remove loader when React is ready -->
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        setTimeout(() => {
          loader.classList.add('loaded');
          setTimeout(() => loader.remove(), 300);
        }, 100);
      }
    });
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
