<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>mxster</title>
  <meta name="description" content="Song hören, Jahr raten, an die richtige Stelle der Zeitleiste legen. Ein Musikspiel für eure Runde.">
  <!-- Private, sign-in-only app: keep it out of search results -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#191113">

  <!-- Pre-paint theme (prevents a flash when the light theme is stored) -->
  <script>
    try {
      var t = localStorage.getItem('mxster_theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#fff8f7';
      }
    } catch (e) {}
  </script>

  <link rel="preload" href="/fonts/roboto-flex-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="icon" href="/assets/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/icon-small.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="mxster">
  <meta property="og:description" content="Song hören, Jahr raten, an die richtige Stelle der Zeitleiste legen.">
  <meta property="og:image" content="https://mxster.celox.io/assets/mxster.jpg">
  <meta property="og:site_name" content="mxster">
  <meta property="og:locale" content="de_DE">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mxster">

  <!-- Loader paints before any bundled CSS: hex values mirror design-tokens.css
       (surface neutral-6 / neutral-98, label primary-60, vinyl neutral-4). -->
  <style>
    html { background: #191113; }
    html[data-theme="light"] { background: #fff8f7; }
    #initial-loader {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #initial-loader.loaded { opacity: 0; pointer-events: none; }
    .loader-disc {
      width: 96px; height: 96px; border-radius: 50%;
      background: radial-gradient(circle, #fe4d86 0 22%, #140c0e 23% 100%);
      box-shadow: inset 0 0 0 10px #140c0e, inset 0 0 0 11px #2b2023, inset 0 0 0 20px #140c0e, inset 0 0 0 21px #2b2023;
      animation: loader-spin 1.6s linear infinite;
    }
    html[data-theme="light"] .loader-disc {
      background: radial-gradient(circle, #dc306d 0 22%, #22191b 23% 100%);
    }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loader-disc { animation: none; } }
  </style>
</head>
<body>
  <div id="initial-loader" aria-hidden="true"><div class="loader-disc"></div></div>
  <div id="app"></div>
  <script>
    window.addEventListener('load', function () {
      var loader = document.getElementById('initial-loader');
      if (!loader) return;
      loader.classList.add('loaded');
      setTimeout(function () { loader.remove(); }, 300);
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
