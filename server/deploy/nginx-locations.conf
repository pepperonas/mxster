# Inserted into the HTTPS server block of /etc/nginx/sites-available/mxtape.celox.io
# (replaces the old public /audio/ location). Requires http_auth_request_module
# and a `map $http_upgrade $connection_upgrade { default upgrade; '' close; }`
# in the http block (most hosts already have it, e.g. in conf.d).

    # Room live connections (WebSocket). Before /api/ so the upgrade headers and
    # the long read timeout apply; everything else of /api/rooms works here too.
    # No trailing slash: with one, nginx answers POST /api/rooms with a 301.
    location ^~ /api/rooms {
        proxy_pass http://127.0.0.1:4274;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Cache-Control "no-store" always;
    }

    # API (FastAPI on 127.0.0.1:4274). ^~ keeps the file-type deny rules out.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4274;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Audio only for signed-in, approved accounts
    location ^~ /audio/ {
        auth_request /_mx_audio_auth;
        alias /var/www/html/mxtape/audio/;
        add_header Cache-Control "private, max-age=86400" always;
        add_header Accept-Ranges bytes;
        types { audio/mp4 m4a; audio/mpeg mp3; }
    }

    location = /_mx_audio_auth {
        internal;
        proxy_pass http://127.0.0.1:4274/api/auth/audio-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }
