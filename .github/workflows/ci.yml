name: CI - Audio Player Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'pwa/src/services/**'
      - 'pwa/src/components/game/MusicPlayer.tsx'
      - 'pwa/package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'pwa/src/services/**'
      - 'pwa/src/components/game/MusicPlayer.tsx'
      - 'pwa/package.json'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pwa

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./pwa/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run audio player integration tests
      run: npm test -- src/services/__tests__/audioPlayer.integration.test.ts --run

    - name: Run all tests
      run: npm test --run

    - name: Build TypeScript
      run: npx tsc --noEmit

    - name: Build production bundle
      run: npm run build

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: pwa/coverage/
        if-no-files-found: ignore
